<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="/gopang-wallet.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>K-Insurance AI</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="K-Insurance"/>
  <meta name="theme-color" content="#0f0f0f"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="icon" href="/icons/icon-192.png"/>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --bg:        #0f0f0f;
      --bg-sub:    #1c1c1e;
      --bg-input:  #2c2c2e;
      --sep:       rgba(255,255,255,.1);
      --sep-s:     rgba(255,255,255,.18);
      --label:     #f5f5f7;
      --label-2:   #a1a1aa;
      --label-3:   #52525b;
      --tint:      #3ecf8e;
      --tint-dim:  rgba(62,207,142,.12);
      --tint-bd:   rgba(62,207,142,.25);
      --danger:    #ff453a;
      --font:      'Noto Sans KR', -apple-system, sans-serif;
      --r-sm:      10px;
      --r-md:      14px;
      --safe-top:    env(safe-area-inset-top,    0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); }
    body { font-family: var(--font); color: var(--label); -webkit-font-smoothing: antialiased; }

    #app {
      display: flex; flex-direction: column;
      height: 100dvh; height: 100vh;
      background: var(--bg);
    }

    /* ── 상단 바 ── */
    .top-bar {
      display: flex; align-items: center; gap: 6px;
      padding: calc(var(--safe-top) + 10px) 14px 10px;
      background: var(--bg-sub);
      border-bottom: .5px solid var(--sep);
      flex-shrink: 0;
    }
    .top-logo {
      flex: 1; display: flex; align-items: center; gap: 8px;
      text-decoration: none;
    }
    .top-logo-mark {
      width: 28px; height: 28px; background: var(--tint);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
    }
    .top-logo-text {
      font-size: 15px; font-weight: 600;
      color: var(--label); letter-spacing: -.3px;
    }
    .top-btn {
      width: 34px; height: 34px;
      background: none; border: none; border-radius: 8px;
      color: var(--label-2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, color .12s; flex-shrink: 0;
    }
    .top-btn:hover, .top-btn:active { background: var(--bg-input); color: var(--label); }

    /* ── 메시지 목록 ── */
    #message-list {
      flex: 1; overflow-y: auto;
      padding: 16px 14px 8px;
      display: flex; flex-direction: column; gap: 12px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    #message-list::-webkit-scrollbar { display: none; }

    /* ── 버블 ── */
    .msg-row { display: flex; flex-direction: column; gap: 3px; }
    .msg-row.user { align-items: flex-end; }
    .msg-row.ai   { align-items: flex-start; }

    .msg-bubble {
      max-width: 82%; padding: 10px 13px;
      border-radius: var(--r-md);
      font-size: 14px; line-height: 1.6;
      word-break: break-word; white-space: pre-wrap;
    }
    .msg-row.user .msg-bubble {
      background: var(--tint); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.ai .msg-bubble {
      background: var(--bg-sub); color: var(--label);
      border: .5px solid var(--sep);
      border-bottom-left-radius: 4px;
    }
    .msg-bubble.typing { color: var(--label-3); font-style: italic; }
    .msg-time { font-size: 10px; color: var(--label-3); padding: 0 2px; }

    .ai-avatar {
      width: 26px; height: 26px; background: var(--tint);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ai-row-inner { display: flex; align-items: flex-end; gap: 7px; }

    /* ── 하단 독 ── */
    .input-dock {
      flex-shrink: 0;
      padding: 10px 12px calc(var(--safe-bottom) + 10px);
      background: var(--bg-sub);
      border-top: .5px solid var(--sep);
    }
    .attach-preview {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--label-2);
      padding: 6px 10px;
      background: var(--bg-input);
      border-radius: var(--r-sm);
      margin-bottom: 8px;
    }
    .remove-attach {
      margin-left: auto; background: none; border: none;
      color: var(--label-3); cursor: pointer; font-size: 15px; line-height: 1;
    }
    .input-wrap {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--bg-input);
      border: .5px solid var(--sep-s);
      border-radius: var(--r-md);
      padding: 8px 8px 8px 12px;
      transition: border-color .15s;
    }
    .input-wrap:focus-within { border-color: var(--tint-bd); }
    .input-actions-left { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .ia-btn {
      width: 30px; height: 30px;
      background: none; border: none; border-radius: 8px;
      color: var(--label-3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .12s, background .12s;
    }
    .ia-btn:hover { color: var(--label); background: rgba(255,255,255,.07); }
    .ia-btn.active { color: var(--danger); }
    #msg-input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--label); font-family: var(--font);
      font-size: 15px; line-height: 1.45;
      resize: none; max-height: 120px; padding: 2px 0;
    }
    #msg-input::placeholder { color: var(--label-3); }
    .send-btn {
      width: 32px; height: 32px; flex-shrink: 0;
      background: var(--tint); border: none; border-radius: 8px;
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, opacity .12s;
    }
    .send-btn:disabled { background: var(--bg-input); opacity: .5; cursor: not-allowed; }
    .send-btn:not(:disabled):hover { background: #2db87a; }

    /* ── 인증 ── */
    #auth-loading {
      position: fixed; inset: 0; z-index: 9999; background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
    }
    .auth-spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--tint-bd); border-top-color: var(--tint);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #auth-modal {
      display: none; position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,.5);
      align-items: center; justify-content: center; padding: 24px;
    }
    #auth-modal.open { display: flex; }
    #auth-modal-content {
      background: var(--bg-sub); border-radius: 18px;
      width: min(400px,100%);
      box-shadow: 0 20px 60px rgba(0,0,0,.5); padding: 28px 24px;
    }

    /* ── 빠른 질문 칩 ── */
    .quick-chips {
      display: flex; gap: 8px; flex-wrap: wrap; padding: 0 0 12px;
    }
    .chip {
      font-size: 12px; padding: 5px 11px; border-radius: 20px;
      border: .5px solid var(--tint-bd);
      color: var(--tint); background: var(--tint-dim);
      cursor: pointer; white-space: nowrap; transition: background .12s;
    }
    .chip:hover { background: rgba(62,207,142,.2); }

    /* ── 환영 ── */
    .welcome-wrap {
      display: flex; flex-direction: column;
      align-items: center; padding: 32px 0 8px; gap: 10px;
    }
    .welcome-icon {
      width: 52px; height: 52px; background: var(--tint);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .welcome-title { font-size: 17px; font-weight: 600; color: var(--label); }
    .welcome-sub   { font-size: 13px; color: var(--label-2); text-align: center; line-height: 1.6; }
  </style>
</head>
<body>

<div id="auth-loading">
  <div class="auth-spinner"></div>
  <div style="font-size:13px;color:var(--label-2);font-weight:500">고팡 인증 확인 중…</div>
</div>

<div id="auth-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div id="auth-modal-content"></div>
</div>

<div id="app" style="display:none">

  <!-- 상단 바 -->
  <div class="top-bar">
    <a href="my_insurance.html" class="top-logo">
      <div class="top-logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" style="width:55%;height:55%" aria-hidden="true">
          <path d="M9 12l2 2l4-4"/>
          <path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1-8.5 15a12 12 0 0 1-8.5-15a12 12 0 0 0 8.5-3"/>
        </svg>
      </div>
      <span class="top-logo-text">K-Insurance AI</span>
    </a>
    <span id="auth-badge" style="font-size:11px;font-weight:600;color:var(--label-2);
      background:var(--bg-input);border:.5px solid var(--sep-s);border-radius:20px;
      padding:3px 9px;cursor:pointer;display:none"></span>
    <button class="top-btn" onclick="clearChat()" title="새 대화" aria-label="새 대화">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <button class="top-btn" onclick="location.href='my_insurance.html'" title="내 보험" aria-label="내 보험">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </button>
  </div>

  <!-- 메시지 목록 -->
  <div id="message-list">
    <div class="welcome-wrap" id="welcome-wrap">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" style="width:55%;height:55%" aria-hidden="true">
          <path d="M9 12l2 2l4-4"/>
          <path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1-8.5 15a12 12 0 0 1-8.5-15a12 12 0 0 0 8.5-3"/>
        </svg>
      </div>
      <div class="welcome-title">K-Insurance AI 상담사</div>
      <div class="welcome-sub">보험 가입 · 청구 · 보험금에 관해<br>무엇이든 질문하세요.</div>
    </div>
    <div class="quick-chips" id="quick-chips">
      <span class="chip" onclick="sendQuick('지금 가입된 보험이 뭐야?')">내 보험 조회</span>
      <span class="chip" onclick="sendQuick('보험금 청구하려면 어떻게 해?')">보험금 청구</span>
      <span class="chip" onclick="sendQuick('내 리스크 점수 알려줘')">리스크 점수</span>
      <span class="chip" onclick="sendQuick('자동차 사고가 났어. 어떻게 해야 해?')">사고 처리</span>
      <span class="chip" onclick="sendQuick('보험료 할인받을 수 있어?')">할인 요인</span>
    </div>
  </div>

  <!-- 하단 독 -->
  <div class="input-dock">
    <div id="attach-preview" style="display:none" class="attach-preview">
      <span>📎</span><span id="attach-name"></span>
      <button class="remove-attach" onclick="removeAttach()" aria-label="첨부 취소">✕</button>
    </div>
    <div class="input-wrap">
      <div class="input-actions-left">
        <button class="ia-btn" onclick="triggerAttach()" title="파일 첨부" aria-label="파일 첨부">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </button>
        <button class="ia-btn" id="btn-mic" title="음성 입력" aria-label="음성 입력">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>
      </div>
      <textarea id="msg-input" placeholder="메시지를 입력하세요…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled aria-label="전송">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
        </svg>
      </button>
    </div>
    <input type="file" id="file-input" style="display:none"
           accept="image/*,.pdf,.txt,.docx" onchange="handleFileSelect(event)"/>
  </div>
</div>

<script>
/* ── CFG ── */
const CFG = {
  proxyBase:     'https://gopang-proxy.tensor-city.workers.dev',
  model:         'deepseek-v4-pro',
  maxHistory:    24,
  systemPromptURL: 'https://raw.githubusercontent.com/Openhash-Gopang/insurance/main/prompts/SP-INS_agent_v2.0.txt',
  systemPrompt:  null,
  systemPromptFallback:
    '당신은 K-Insurance AI 보험 상담사입니다. ' +
    'PDV·K-Traffic·K-Health 데이터를 기반으로 보험 가입·청구·보험금에 관해 ' +
    '간결하고 정확하게 한국어로 답변하세요. ' +
    '사고 발생 시 즉각적인 처리 절차를 안내하고 보험금 청구를 도와주세요.',
};

let chatHistory  = [];
let attachedFile = null;
let micActive    = false;
let recognition  = null;

/* ── SP 동적 로드 (매뉴얼 §10) ── */
async function loadSystemPrompt() {
  if (CFG.systemPrompt) return CFG.systemPrompt;
  try {
    const r = await fetch(CFG.systemPromptURL + '?t=' + Date.now());
    if (r.ok) {
      const raw = await r.text();
      CFG.systemPrompt = raw.split('\n')
        .filter(l => !l.trimStart().startsWith('#'))
        .join('\n').trim();
      return CFG.systemPrompt;
    }
    throw new Error('HTTP ' + r.status);
  } catch (e) {
    console.warn('[SP] 로드 실패:', e.message);
    CFG.systemPrompt = CFG.systemPromptFallback;
    return CFG.systemPrompt;
  }
}

function timeStr() {
  return new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
}

/* ── 메시지 DOM 추가 ── */
function appendMsg(role, text, isTyping = false) {
  const list = document.getElementById('message-list');
  ['welcome-wrap','quick-chips'].forEach(id => {
    const el = document.getElementById(id); if (el) el.remove();
  });

  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');

  if (role === 'ai') {
    const inner = document.createElement('div');
    inner.className = 'ai-row-inner';

    const avatar = document.createElement('div');
    avatar.className = 'ai-avatar';
    avatar.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:55%;height:55%">
      <path d="M9 12l2 2l4-4"/>
      <path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1-8.5 15a12 12 0 0 1-8.5-15a12 12 0 0 0 8.5-3"/>
    </svg>`;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble' + (isTyping ? ' typing' : '');
    bubble.textContent = text;
    inner.appendChild(avatar);
    inner.appendChild(bubble);
    row.appendChild(inner);

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.style.paddingLeft = '33px';
    time.textContent = timeStr();
    row.appendChild(time);
    list.appendChild(row);
    list.scrollTop = list.scrollHeight;
    return bubble;
  } else {
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = timeStr();
    row.appendChild(bubble);
    row.appendChild(time);
    list.appendChild(row);
    list.scrollTop = list.scrollHeight;
    return bubble;
  }
}

function updateSendBtn() {
  const input = document.getElementById('msg-input');
  document.getElementById('send-btn').disabled = !input.value.trim() && !attachedFile;
}

function autoResize(el) {
  el.style.height = '';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

/* ── 전송 ── */
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const btn   = document.getElementById('send-btn');
  const text  = input.value.trim();
  if (!text && !attachedFile) return;

  input.value = '';
  input.style.height = '';
  btn.disabled = true;

  if (text) appendMsg('user', text);
  chatHistory.push({ role: 'user', content: text || '[파일 첨부]' });
  const typingBubble = appendMsg('ai', '…', true);

  try {
    const sp  = await loadSystemPrompt();
    const res = await fetch(CFG.proxyBase + '/deepseek', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model:        CFG.model,
        system:       sp,
        messages:     chatHistory.slice(-CFG.maxHistory),
        max_tokens:   1000,
        temperature:  0.6,
        _use_env_key: 'DEEPSEEK_API_KEY',
      }),
    });
    const data  = await res.json();
    const reply = data?.choices?.[0]?.message?.content
                || data?.content?.[0]?.text
                || '죄송합니다, 응답을 받지 못했습니다. 잠시 후 다시 시도해 주세요.';
    typingBubble.classList.remove('typing');
    typingBubble.textContent = reply;
    chatHistory.push({ role: 'assistant', content: reply });
  } catch (err) {
    typingBubble.classList.remove('typing');
    typingBubble.textContent = '네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
  } finally {
    btn.disabled = false;
    removeAttach();
    document.getElementById('message-list').scrollTop = 999999;
  }
}

function sendQuick(text) {
  const input = document.getElementById('msg-input');
  input.value = text;
  autoResize(input);
  updateSendBtn();
  sendMessage();
}

/* ── 대화 초기화 ── */
function clearChat() {
  chatHistory = [];
  CFG.systemPrompt = null;
  document.getElementById('message-list').innerHTML = `
    <div class="welcome-wrap" id="welcome-wrap">
      <div class="welcome-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" style="width:55%;height:55%">
          <path d="M9 12l2 2l4-4"/>
          <path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1-8.5 15a12 12 0 0 1-8.5-15a12 12 0 0 0 8.5-3"/>
        </svg>
      </div>
      <div class="welcome-title">K-Insurance AI 상담사</div>
      <div class="welcome-sub">보험 가입 · 청구 · 보험금에 관해<br>무엇이든 질문하세요.</div>
    </div>
    <div class="quick-chips" id="quick-chips">
      <span class="chip" onclick="sendQuick('지금 가입된 보험이 뭐야?')">내 보험 조회</span>
      <span class="chip" onclick="sendQuick('보험금 청구하려면 어떻게 해?')">보험금 청구</span>
      <span class="chip" onclick="sendQuick('내 리스크 점수 알려줘')">리스크 점수</span>
      <span class="chip" onclick="sendQuick('자동차 사고가 났어. 어떻게 해야 해?')">사고 처리</span>
      <span class="chip" onclick="sendQuick('보험료 할인받을 수 있어?')">할인 요인</span>
    </div>`;
}

/* ── 첨부 ── */
function triggerAttach() { document.getElementById('file-input').click(); }
function handleFileSelect(e) {
  const file = e.target.files[0]; if (!file) return;
  attachedFile = file;
  document.getElementById('attach-preview').style.display = 'flex';
  document.getElementById('attach-name').textContent = file.name;
  updateSendBtn();
}
function removeAttach() {
  attachedFile = null;
  document.getElementById('attach-preview').style.display = 'none';
  document.getElementById('file-input').value = '';
  updateSendBtn();
}

/* ── 마이크 (매뉴얼 §3 v3.6 — 직접 호출 패턴) ── */
function toggleMic() {
  if (micActive) { if (recognition) recognition.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('이 브라우저는 음성 인식을 지원하지 않습니다.'); return; }

  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (e) => {
    const t     = e.results[0][0].transcript;
    const input = document.getElementById('msg-input');
    if (input && t) {
      input.value = t;
      autoResize(input);   // ★ 직접 호출 (dispatchEvent 금지)
      updateSendBtn();     // ★ 직접 호출
    }
    micActive = false; setMicUI(false);
  };
  recognition.onerror = () => { micActive = false; setMicUI(false); };
  recognition.onend   = () => { micActive = false; setMicUI(false); };
  recognition.start();
  micActive = true; setMicUI(true);
}
function setMicUI(active) {
  const btn = document.getElementById('btn-mic');
  if (btn) btn.classList.toggle('active', active);
}
document.getElementById('btn-mic').addEventListener('click', toggleMic);

/* ── 입력 이벤트 ── */
const msgInput = document.getElementById('msg-input');
msgInput.addEventListener('input', function() { autoResize(this); updateSendBtn(); });

/* ── GWP 파라미터 파싱 (매뉴얼 §6-4) ── */
var _params     = new URLSearchParams(location.search);
var _gwpOrigin  = _params.get('origin') || 'https://hondi.net';
var _gwpContext = null;
try {
  var _ctxRaw = _params.get('ctx') || '';
  var _ctxEnc = _params.get('ctx_enc');
  if (_ctxRaw) {
    _gwpContext = (_ctxEnc === 'b64')
      ? decodeURIComponent(escape(atob(_ctxRaw)))
      : decodeURIComponent(_ctxRaw);
  }
} catch(e) { console.warn('[GWP] ctx 파싱 실패:', e.message); }

/* ── SSO 콜백 ── */
window._onGopangAuth = function(user) {
  if (!user) return;
  document.getElementById('auth-loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  const badge = document.getElementById('auth-badge');
  if (badge) {
    const lvlColor = { L0:'var(--label-3)', L1:'#00bcd4', L2:'var(--tint)', L3:'#ff9800' };
    badge.style.color = lvlColor[user.level] || lvlColor.L0;
    badge.textContent = user.level || 'L0';
    badge.title       = user.ipv6 || '';
    badge.style.display = 'block';
  }

  if (_gwpContext) {
    setTimeout(() => sendQuick(_gwpContext), 400);
  }

  const clean = new URL(location.href);
  ['gwp','gwp_token','ctx','ctx_enc','origin'].forEach(k => clean.searchParams.delete(k));
  history.replaceState({}, '', clean.toString());
};
</script>
